name: Verify Rust release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      APP_ENV_FILE: ''
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.5.0
      - name: Install pinned build tools
        run: |
          npm install --global --ignore-scripts pnpm@11.21.0
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify backend
        run: |
          cargo fmt --manifest-path backend/Cargo.toml -- --check
          cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path backend/Cargo.toml --all-targets --all-features --locked
      - name: Verify frontend and packaged runtime
        run: |
          pnpm check
          pnpm test:unit
          pnpm build
          pnpm test:build
          pnpm verify:release
      - name: Production browser acceptance
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium --only-shell
          pnpm test:e2e
      - name: Audit locked dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file backend/Cargo.lock
          pnpm audit
      - name: Retain fixture-only failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
