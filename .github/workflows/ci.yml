name: Verify Rust release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      APP_ENV_FILE: ''
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned development tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: '2026.10.3'
          install_args: node pnpm rust
      - name: Restore Rust dependencies and audit tool
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: api -> target
          # Native artifacts and installed tools must match the runner and audit version.
          key: ubuntu-26.04-cargo-audit-0.22.2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install locked workspace dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Linux native prerequisites
        run: sudo apt-get update && sudo apt-get install --yes build-essential clang libclang-dev cmake pkg-config
      - name: Set up checksummed local model explicitly
        run: node api/scripts/fetch-embedding-model.ts .artifacts/embedding-model
      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: |
          cargo audit --file api/Cargo.lock
          pnpm audit
      - name: Verify backend
        run: |
          cargo fmt --manifest-path api/Cargo.toml -- --check
          cargo clippy --manifest-path api/Cargo.toml --all-targets --all-features --locked --timings -- -D warnings
          cargo test --manifest-path api/Cargo.toml --all-targets --all-features --locked --timings
      - name: Explicit native model and maximum import gates
        env:
          BRANCH_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/.artifacts/embedding-model
        run: |
          cargo test --manifest-path api/Cargo.toml --locked --test embeddings native_embedding_matches_pinned_public_fixture -- --ignored --exact
          cargo test --manifest-path api/Cargo.toml --locked --test migration thirty_two_mib_native_finalization_is_atomic_and_bounded -- --ignored --exact
      - name: Verify frontend
        run: |
          pnpm check
          pnpm test:unit
          pnpm build:frontend
      - name: Build and verify packaged runtime
        run: |
          pnpm build:backend --timings
          node scripts/package-release.ts
          pnpm test:build
      - name: Production browser acceptance
        run: |
          pnpm --dir app exec playwright install --with-deps chromium --only-shell
          pnpm test:e2e
      - name: Retain compiler timing reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cargo-timings-linux
          path: api/target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain fixture-only failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence-linux
          path: |
            app/test-results/
            app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
