<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @font-face{font-family:DM;src:url('fonts/dm-sans-variable.ttf')}@font-face{font-family:Instrument;src:url('fonts/instrument-serif-regular.ttf')}@font-face{font-family:Instrument;src:url('fonts/instrument-serif-italic.ttf');font-style:italic}
    text{fill:#20382c;font-family:DM,sans-serif}.serif{font-family:Instrument,Georgia,serif}.small{font-size:14px;letter-spacing:1px}.label{font-size:12px;font-weight:500}.title{font-size:25px;letter-spacing:-.6px}.stem{fill:none;stroke:#41634c;stroke-linecap:round}.leaf{fill:#dfed9e;stroke:#41634c;stroke-width:1.5}
  </style>
  <defs>
