    <text x="809" y="520" font-size="27" style="fill:#f3f3e9">How can a tiny card</text>
    <text x="809" y="551" font-size="27" style="fill:#f3f3e9">hold so much?</text>
  </g>
  <path class="stem" stroke-width="1.5" opacity=".55" d="M939 587Q927 603 893 615M939 587V622M939 587Q952 605 986 615"/>
