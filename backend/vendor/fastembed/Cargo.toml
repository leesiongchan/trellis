[package]
edition = "2021"
rust-version = "1.88"
name = "fastembed"
version = "7.5.0"
authors = [
    "Anush008 <mail@anush.sh>",
    "Josh Niemelä <josh@jniemela.dk>",
    "GrisiaEvy <a115020115@gmail.com>",
    "George MacKerron <georgemackerron@neon.tech>",
    "Timon Vonk <mail@timonv.nl>",
    "Luya Wang <luya.wang@qq.com>",
    "Tri <tri@triandco.com>",
    "Denny Wong <denwong47@hotmail.com>",
    "Alex Rozgo <alex.rozgo@gmail.com>",
    "Gil <dddhkts1@gmail.com>",
]
build = false
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Library for generating vector embeddings, reranking locally."
homepage = "https://crates.io/crates/fastembed"
documentation = "https://docs.rs/fastembed"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Anush008/fastembed-rs"

[package.metadata.docs.rs]
features = [
    "qwen3",
    "nomic-v2-moe",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
accelerate = [
    "qwen3",
    "nomic-v2-moe",
    "dep:accelerate-src",
    "candle-core/accelerate",
    "candle-nn/accelerate",
]
cuda = [
    "qwen3",
    "nomic-v2-moe",
    "candle-core/cuda",
    "candle-nn/cuda",
]
cudnn = [
    "qwen3",
    "nomic-v2-moe",
    "candle-core/cudnn",
    "candle-nn/cudnn",
    "cuda",
]
default = [
    "onnx",
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
    "image-models",
]
directml = [
    "onnx",
    "ort/directml",
]
hf-hub = [
    "dep:hf-hub",
    "hf-hub?/ureq",
]
hf-hub-native-tls = [
    "hf-hub",
    "hf-hub?/native-tls",
]
hf-hub-rustls-tls = [
    "hf-hub",
    "hf-hub?/rustls-tls",
]
image-models = [
    "onnx",
    "dep:image",
]
metal = [
    "qwen3",
    "nomic-v2-moe",
    "candle-core/metal",
    "candle-nn/metal",
    "dep:candle-metal-kernels",
]
mkl = [
    "qwen3",
    "nomic-v2-moe",
    "dep:intel-mkl-src",
    "candle-nn/mkl",
    "candle-core/mkl",
]
nomic-v2-moe = [
    "dep:candle-core",
    "dep:candle-nn",
    "hf-hub",
]
online = ["hf-hub-native-tls"]
onnx = [
    "dep:ort",
    "dep:ndarray",
    "dep:safetensors",
]
optimum-cli = []
ort-download-binaries = ["ort-download-binaries-native-tls"]
ort-download-binaries-native-tls = [
    "onnx",
    "ort/download-binaries",
    "ort/tls-native",
]
ort-download-binaries-rustls-tls = [
    "onnx",
    "ort/download-binaries",
    "ort/tls-rustls",
]
ort-load-dynamic = [
    "onnx",
    "ort/load-dynamic",
]
qwen3 = [
    "qwen3-text",
    "qwen3-vl",
    "hf-hub",
]
qwen3-text = [
    "dep:candle-core",
    "dep:candle-nn",
]
qwen3-vl = [
    "qwen3-text",
    "dep:image",
    "hf-hub",
]
webgpu = [
    "onnx",
    "ort/webgpu",
]

[lib]
name = "fastembed"
path = "src/lib.rs"

[[test]]
name = "bgem3"
path = "tests/bgem3.rs"

[[test]]
name = "bgem3_comparison"
path = "tests/bgem3_comparison.rs"

[[test]]
name = "if_splade"
path = "tests/if_splade.rs"

[[test]]
name = "image-embeddings"
path = "tests/image-embeddings.rs"

[[test]]
name = "nomic_v2_moe"
path = "tests/nomic_v2_moe.rs"

[[test]]
name = "optimum_cli_export"
path = "tests/optimum_cli_export.rs"

[[test]]
name = "qwen3"
path = "tests/qwen3.rs"

[[test]]
name = "text-embeddings"
path = "tests/text-embeddings.rs"

[dependencies.accelerate-src]
version = "0.3.2"
optional = true

[dependencies.candle-core]
version = "0.11.0"
optional = true

[dependencies.candle-metal-kernels]
version = "0.11.0"
optional = true

[dependencies.candle-nn]
version = "0.11.0"
optional = true

[dependencies.hf-hub]
version = "0.5.0"
optional = true
default-features = false

[dependencies.image]
version = "0.25.10"
optional = true

[dependencies.intel-mkl-src]
version = "0.8.1"
optional = true

[dependencies.ndarray]
version = "0.17.2"
optional = true
default-features = false

[dependencies.ort]
version = "=2.0.0-rc.15"
features = [
    "ndarray",
    "std",
    "api-24",
]
optional = true
default-features = false

[dependencies.safetensors]
version = "0.8.0"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.tokenizers]
version = "0.23.2"
features = ["onig"]
default-features = false
