[package]
name = "branch-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
strip = true
