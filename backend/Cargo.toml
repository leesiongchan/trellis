[package]
name = "branch-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
strip = true
