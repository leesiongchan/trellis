[package]
name = "branch-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus-client = "=0.25.1"
http-body-util = "0.1"
tower-http = { version = "=0.7.1", default-features = false, features = ["sensitive-headers"] }
mime_guess = "2"
rustix = { version = "1", features = ["fs"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
tokio-io-timeout = "=1.2.1"
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
rustix = { version = "1", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
strip = true
