[package]
name = "branch-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
axum = { version = "^0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
thiserror = "^2.0.21"
url = "^2.5.8"
time = { version = "^0.3.55", features = ["parsing", "formatting", "serde"] }
tokio = { version = "^1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
base64 = "^0.23.1"
hmac = "^0.13.0"
sha2 = "^0.11.1"
hex = "^0.4.3"
unicode-normalization = "^0.1.26"
subtle = "^2.6.1"
reqwest = { version = "^0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-util = { version = "^0.7.20", features = ["rt"] }
uuid = { version = "^1.29.0", features = ["v4"] }
futures-util = "^0.3.34"
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.23", features = ["json", "env-filter"] }
prometheus-client = "^0.25.1"
http-body-util = "^0.1.5"
tower-http = { version = "^0.7.1", default-features = false, features = ["sensitive-headers"] }
mime_guess = "^2.0.5"
rustix = { version = "^1.1.6", features = ["fs"] }
hyper = { version = "^1.12.0", features = ["server", "http1"] }
hyper-util = { version = "^0.1.21", features = ["server", "http1", "tokio", "service"] }
tokio-io-timeout = "^1.2.1"
dotenvy = "^0.15.7"
surrealdb = { version = "^3.3.4", default-features = false, features = ["kv-rocksdb"] }
fastembed = { version = "^7.5.0", default-features = false, features = ["onnx", "ort-download-binaries-rustls-tls"] }
tokenizers = { version = "^0.23.2", default-features = false, features = ["onig"] }
ort = { version = "^2.0.0-rc.15", default-features = false, features = ["std", "api-24"] }

[dev-dependencies]
tokio = { version = "^1.54.1", features = ["test-util"] }
tower = { version = "^0.5.3", features = ["util"] }
tempfile = "^3.27.0"
rustix = { version = "^1.1.6", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Startup hashes the executable; keep SHA-256 fast in dev and inherited test builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
fastembed = { path = "vendor/fastembed" }
